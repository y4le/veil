<svg
  xmlns="http://www.w3.org/2000/svg"
  id="veil-card"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="veil-card-title veil-card-description"
>
  <title id="veil-card-title">Veil</title>
  <desc id="veil-card-description">
    A centered Veil wordmark overlapped by a ghost. The ghost's outline is
    always visible; its translucent body fades in and out and its wavy hem
    ripples when the project card is active.
  </desc>

  <style>
    :root {
      color-scheme: light dark;
      --card-surface: light-dark(#fbf7ec, #0e0e0d);
      --card-ink: light-dark(#1a1814, #e8e3d5);
      /* The resting contour. Warm cream needs more ink than warm near-black
         for the outline to read at the same weight in both schemes. */
      --card-trace: light-dark(rgb(26 24 20 / 0.35), rgb(232 227 213 / 0.28));
    }

    :root[data-color-scheme="light"] {
      color-scheme: only light;
    }

    :root[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    .veil-wordmark {
      fill: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }

    .veil-ghost {
      opacity: 0;
      animation: veil-ghost-fade 1s ease-in-out infinite alternate both;
    }

    .veil-ghost-body {
      fill: var(--card-ink);
    }

    .veil-ghost-hem {
      fill: var(--card-ink);
      animation: veil-ghost-wave 900ms linear infinite both;
    }

    .veil-ghost-eye {
      fill: var(--card-surface);
    }

    .veil-ghost-trace-eye {
      fill: none;
      stroke: var(--card-trace);
      stroke-width: 5;
    }

    @keyframes veil-ghost-fade {
      from {
        opacity: 0;
      }
      to {
        opacity: 0.5;
      }
    }

    @keyframes veil-ghost-wave {
      to {
        transform: translateX(-192px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .veil-ghost,
      .veil-ghost-hem {
        animation: none;
      }

      .veil-ghost {
        opacity: 0.5;
      }
    }
  </style>

  <defs>
    <clipPath id="veil-ghost-hem-clip">
      <rect x="557" y="620" width="504" height="200" />
    </clipPath>

    <!-- Erode the silhouette and subtract it from itself: whatever shape the
         body and the rippling hem happen to union into, the difference is that
         union's own edge. Tracing the contour this way keeps it registered
         with the moving hem, which a second hand-drawn path cannot do while
         the wave slides past the ghost's fixed sides. -->
    <filter
      id="veil-ghost-trace-filter"
      filterUnits="userSpaceOnUse"
      x="537"
      y="148"
      width="544"
      height="668"
      color-interpolation-filters="sRGB"
    >
      <feMorphology
        in="SourceAlpha"
        operator="erode"
        radius="5"
        result="veil-ghost-core"
      />
      <feComposite
        in="SourceAlpha"
        in2="veil-ghost-core"
        operator="out"
        result="veil-ghost-edge"
      />
      <feFlood flood-color="var(--card-trace)" result="veil-ghost-trace-ink" />
      <feComposite in="veil-ghost-trace-ink" in2="veil-ghost-edge" operator="in" />
    </filter>
  </defs>

  <text
    class="veil-wordmark"
    x="809"
    y="585"
    text-anchor="middle"
    aria-label="Veil"
  >veil</text>

  <g class="veil-ghost" aria-label="Translucent ghost">
    <path
      class="veil-ghost-body"
      d="M557 660V434C557 274 662 168 809 168C956 168 1061 274 1061 434V660Z"
    />
    <g clip-path="url(#veil-ghost-hem-clip)">
      <path
        class="veil-ghost-hem"
        d="M365 620H1253V738C1221 674 1189 674 1157 738C1125 802 1093 802 1061 738C1029 674 997 674 965 738C933 802 901 802 869 738C837 674 805 674 773 738C741 802 709 802 677 738C645 674 613 674 581 738C549 802 517 802 485 738C453 674 421 674 389 738L365 738Z"
      />
    </g>
    <ellipse class="veil-ghost-eye" cx="731" cy="446" rx="32" ry="48" />
    <ellipse class="veil-ghost-eye" cx="887" cy="446" rx="32" ry="48" />
  </g>

  <!-- The contour carries the still frame, so it never fades and is drawn last:
       the eyes stay drawn rather than being washed out by the solid ghost's
       knockouts once it fades in. The silhouette below repeats the solid
       ghost's geometry verbatim, sharing its classes and its hem animation;
       edit the two copies together or the contour will drift off the body. -->
  <g class="veil-ghost-trace" aria-hidden="true">
    <g filter="url(#veil-ghost-trace-filter)">
      <path
        class="veil-ghost-body"
        d="M557 660V434C557 274 662 168 809 168C956 168 1061 274 1061 434V660Z"
      />
      <g clip-path="url(#veil-ghost-hem-clip)">
        <path
          class="veil-ghost-hem"
          d="M365 620H1253V738C1221 674 1189 674 1157 738C1125 802 1093 802 1061 738C1029 674 997 674 965 738C933 802 901 802 869 738C837 674 805 674 773 738C741 802 709 802 677 738C645 674 613 674 581 738C549 802 517 802 485 738C453 674 421 674 389 738L365 738Z"
        />
      </g>
    </g>
    <ellipse class="veil-ghost-trace-eye" cx="731" cy="446" rx="32" ry="48" />
    <ellipse class="veil-ghost-trace-eye" cx="887" cy="446" rx="32" ry="48" />
  </g>
</svg>
