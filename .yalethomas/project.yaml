title: Veil
description: Encrypt static HTML at build time and unlock it in the browser without a server.
bullets:
  - Seals protected pages with AES-256-GCM and ships no protected plaintext in the deploy artifact.
  - Shares scoped unlock state across multi-page sites without storing the passphrase.
  - Audits wrapper integrity, input correspondence, and decryption before deployment.
